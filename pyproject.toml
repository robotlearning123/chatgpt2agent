[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt2agent"
version = "0.0.2"
description = "Use your ChatGPT Plus/Pro in Claude Code and other AI agents — one command setup"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICES.md"]
requires-python = ">=3.10"
keywords = ["mcp", "chatgpt", "claude", "openai", "agent", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mcp>=1.26.0",
    "uvicorn>=0.30.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "curl_cffi>=0.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]

[project.scripts]
gpt2agent = "gpt2agent.server:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["gpt2agent*"]

[tool.setuptools.package-data]
gpt2agent = [
    "skills/deep-research/SKILL.md",
    "skills/deep-research/bin/*",
]

[project.urls]
Homepage = "https://github.com/robotlearning123/chatgpt2agent"
Repository = "https://github.com/robotlearning123/chatgpt2agent"
Changelog = "https://github.com/robotlearning123/chatgpt2agent/blob/main/CHANGELOG.md"
Issues = "https://github.com/robotlearning123/chatgpt2agent/issues"
